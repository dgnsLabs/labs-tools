<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Labs Tools</title>
<meta name="description" content="서버 없이 폰 브라우저에서 바로 쓰는 사진 · PDF · 링크 유틸리티 7가지">
<meta name="theme-color" content="#0a0e14">
<meta name="color-scheme" content="dark light">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LabsTools">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<div class="app-shell">
  <header class="appbar">
    <button class="icon-btn" id="back-btn" type="button" aria-label="홈으로" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg>
    </button>
    <div class="appbar-titles">
      <span class="appbar-title" id="bar-title">Labs Tools</span>
      <span class="appbar-sub" id="bar-sub">7가지 생활 유틸</span>
    </div>
    <button class="icon-btn" id="theme-btn" type="button" aria-label="라이트/다크 전환">
      <svg class="ico-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg>
      <svg class="ico-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6"/></svg>
    </button>
  </header>

  <main id="view">
    <div id="home"></div>
    <div id="tool-host"></div>
  </main>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<noscript><p style="padding:24px;color:#fff">이 도구를 쓰려면 JavaScript를 켜 주세요.</p></noscript>

<script src="./js/lib/common.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
